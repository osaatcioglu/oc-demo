---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-application
  namespace: argocd
spec:
  project: default

  # Source repository configuration
  source:
    repoURL: https://github.com/your-org/your-repo.git
    targetRevision: main
    path: k8s/manifests

    # Optional: Helm configuration
    # helm:
    #   valueFiles:
    #     - values.yaml
    #   parameters:
    #     - name: image.tag
    #       value: "1.0.0"

    # Optional: Kustomize configuration
    # kustomize:
    #   namePrefix: prod-

  # Destination cluster and namespace
  destination:
    server: https://kubernetes.default.svc
    namespace: my-app-namespace

  # Sync policy
  syncPolicy:
    automated:
      prune: true      # Delete resources that are no longer in Git
      selfHeal: true   # Automatically sync when cluster state differs
      allowEmpty: false
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m

  # Health check
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
